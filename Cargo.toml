[workspace]
resolver = "3"
members = ["crates/opfspack", "crates/core", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["MegaBlackLabel"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"

# mupdf-sys の C コードはデバッグビルドだと最適化なしで非常に遅い（1 ページ数秒）。
# PDF レンダリング速度に直結するため常に最適化してビルドする。
[profile.dev.package.mupdf-sys]
opt-level = 3

[profile.release]
# リリースビルドにデバッグ情報を含めない（ビルド高速化・バイナリ縮小）
debug = false
