[workspace]
resolver = "3"
members = ["crates/opfspack", "crates/core", "crates/app"]

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "MIT"
authors = ["MegaBlackLabel"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"


# webp のエンコード/デコード（libwebp）は C 実装で、デバッグビルドだと
# 最適化なしになり非常に遅い（1000px のページ 1 枚で数秒）。PDF のページ画像を
# 作る経路とカードのサムネイルがこれを使うため、dev プロファイルでも最適化する。
# （以前は同じ理由で mupdf-sys に同じ指定をしていた）
[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.release]
# リリースビルドにデバッグ情報を含めない（ビルド高速化・バイナリ縮小）
debug = false
# シンボルを落として配布物を小さくする（63MB -> 大幅減）
strip = true
