[package]
name = "opfspack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
pbkdf2 = "0.12"
hkdf = "0.12"
# バックアップ封筒（§11）の平文 HMAC。HKDF の内部依存として既にグラフにあり、
# 直接依存にしてもライセンス一覧（licenses.json）は変わらない。
hmac = "0.12"
sha2.workspace = true
aes-gcm = "0.10"
base64 = "0.22"
unicode-normalization = "0.1"
flate2 = "1"
crc32fast = "1"
rand = "0.8"
[dev-dependencies]
crc32fast = "1"
hex = "0.4"
