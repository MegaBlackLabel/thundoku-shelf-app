[package]
name = "thundoku-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
regex = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# xwin クロスビルドで SSE4.1 ソースがフラグなしでコンパイルされて失敗するため、
# sse41 feature を有効にする（-msse4.1 が付与される）
libwebp-sys = { version = "0.9", features = ["sse41"] }
thiserror.workspace = true
log.workspace = true
ureq = { version = "2", features = ["tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
# ZIP（FANZA / BOOTH / DLsite）のエントリ名は Shift-JIS（CP932）が主流。
# `zip` crate は UTF-8 フラグの無い名前を CP437 として復号するため、自前でデコードする。
encoding_rs = "0.8"
percent-encoding = "2"
md5 = "0.7"
rand = "0.8"
sha2.workspace = true
aes-gcm = "0.10"
socket2 = "0.6"
opfspack = { path = "../opfspack" }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "bmp", "tiff"] }
webp = "0.3"
lindera = { version = "0.44", features = ["ipadic"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
yaml-rust2 = "0.13"
# PDF レンダリングは PDFium（BSD-3-Clause / Apache-2.0）に統一した。mupdf は
# AGPL-3.0 で、MIT で配布するこのアプリと両立しないため依存から外している。
# PDFium は**実行時ロード**（静的リンクではない）ので、ビルド時にライブラリは
# 要らない。dylib / dll は実行ファイルの隣（macOS の .app は
# Contents/Frameworks）に置く。static を有効にしないこと — prebuilt の static は
# macOS で FPDF_FORMFILL を欠きリンクできない。
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }


[dev-dependencies]
parking_lot = "0.12"
