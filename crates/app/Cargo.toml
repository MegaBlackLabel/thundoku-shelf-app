[package]
name = "thundoku-shelf"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "thundoku-shelf"
path = "src/main.rs"

[dependencies]
# windows-manifest は xwin クロスビルドで llvm-rc の相対パス解決に失敗するため外す
# （macOS / Windows のアプリ実行には不要。default の wayland/x11 も不要）
# Carousel（Multiple Item）は未リリース。crates.io の最新 0.6.1 の gpui-component には
# carousel モジュールが無いため、上流 main を rev 固定で使う（本棚リストの関連書籍カルーセル）。
# Carousel を含む版が crates.io に出たら `version = "0.6"` に戻す。
# `test-support`（gpui のテストハーネス）は **dev-dependencies 側だけ**で有効にする:
# 本番ビルドで有効にすると gpui の `leak-detection` が入り、終了時に残っている
# ハンドル（常駐タスクが持つ `WeakEntity` など）で `Exited with leaked handles` パニックする。
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "84f57fdfcb4910623fb0bb7f795b077e249f9271" }
gpui-wry = { version = "0.6" }
thundoku-core = { path = "../core" }
url = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
lb-wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = "0.6"
anyhow = "1"
log.workspace = true
env_logger = "0.11"
serde_json.workspace = true
serde.workspace = true
 dirs = "6"
rfd = "0.17"
 parking_lot = "0.12"
ureq = { version = "2", features = ["tls", "json"] }
opfspack = { path = "../opfspack" }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
webp = "0.3"
libwebp-sys = { version = "0.9", features = ["sse41"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
resvg = "0.44"
usvg = { version = "0.44", default-features = false }
 tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

 [build-dependencies]
# Windows exe のアイコン埋め込み（リリースビルド時のみ、build.rs から使用）
winres = "0.1"

[dev-dependencies]
# ライセンス一覧の生成・突き合わせ（examples/regen_licenses.rs と licenses.rs のテスト）
toml = "1"
# テストは gpui のテストハーネス（`#[gpui_kit::test]` / `TestAppContext`）を使う。
# 本番ビルドには入れない（`leak-detection` が終了時にパニックするため）。
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "84f57fdfcb4910623fb0bb7f795b077e249f9271", features = ["test-support"] }
