name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (core crates) — Linux
        if: runner.os == 'Linux'
        run: cargo clippy -p opfspack -p thundoku-core --all-targets -- -D warnings
      - name: Clippy (workspace) — macOS / Windows
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (opfspack + core) — Linux
        if: runner.os == 'Linux'
        run: cargo test -p opfspack -p thundoku-core

      - name: Test (workspace) — macOS
        if: runner.os == 'macOS'
        run: cargo test --workspace

      - name: Test (opfspack + core) + build app — Windows
        if: runner.os == 'Windows'
        run: |
          cargo test -p opfspack -p thundoku-core
          cargo build -p thundoku-shelf
