name: CI

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # PDF レンダリングは PDFium を実行時ロードする。テストは crates/core を
      # CWD としてライブラリを探すので、テストの前に取得しておく（SHA256 検証つき）。
      - name: Fetch PDFium (runtime library for PDF rendering)
        shell: bash
        run: bash scripts/fetch-pdfium.sh

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Clippy (core crates) — Linux
        if: runner.os == 'Linux'
        run: cargo clippy -p opfspack -p thundoku-core --all-targets -- -D warnings
      - name: Clippy (workspace) — macOS / Windows
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (opfspack + core) — Linux
        if: runner.os == 'Linux'
        run: cargo test -p opfspack -p thundoku-core

      - name: Test (workspace) — macOS
        if: runner.os == 'macOS'
        run: cargo test --workspace

      - name: Test (opfspack + core) + build app — Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p opfspack -p thundoku-core
          cargo build -p thundoku-shelf
