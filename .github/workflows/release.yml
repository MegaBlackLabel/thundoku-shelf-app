name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch だけだと macOS x86_64 と Windows x86_64 でファイル名/アーティファクト名が
          # 衝突する（upload-artifact@v4 は同名で 409 になる）ため os_name も持たせる
          - os: macos-14
            os_name: macos
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-14
            os_name: macos
            target: x86_64-apple-darwin
            arch: x86_64
          - os: windows-latest
            os_name: windows
            target: x86_64-pc-windows-msvc
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 成果物名にバージョン（タグ）を入れる。例: タグ v1.2.3 -> 1.2.3
      - name: Compute version
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      # cargo のビルドキャッシュを保存/復元。2 回目以降は依存のフルビルドを省略。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p thundoku-shelf

      # PDFium (BSD-3-Clause / Apache-2.0) は mupdf (AGPL-3.0) の代替として
      # macOS でも使う。静的リンクはしない — 実行時に dylib をロードする方式なら
      # prebuilt の static ライブラリが macOS で欠いている FPDF_FORMFILL を要求しない。
      # 供給網対策として SHA256 を検証してから展開する。
      - name: Fetch pdfium (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # アセットは gh（API 経由）で落とす。リリースの CDN URL を直に叩くと、
          # ランナーから 404 が返ることがある（v0.2.3 のリリースで macOS の 2 ジョブが失敗。
          # Windows ジョブは同じタグの別アセットを取得できていた）。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            aarch64)
              asset=pdfium-mac-arm64
              sha=52e94ca5aa8847934330daf3f8150c190682c5ca93831468794f8b90d4392e40
              ;;
            x86_64)
              asset=pdfium-mac-x64
              sha=6dedf83990e0e3d6b7c93c9e7589c5a126b0ae14b7464d76120cff7a26afb18b
              ;;
            *)
              echo "unknown arch: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-${asset}.tgz"
          # 認証ヘッダ付きで取得する（未認証だと混雑時に 404 が返ることがある。
          # v0.2.3 のリリースで macOS の 2 ジョブがこれで落ちた）。
          # 失敗したら間を置いて再試行し、それでも駄目なら API 経由（アセット ID）に切り替える。
          fetched=0
          for attempt in 1 2 3; do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o pdfium.tgz "$url"; then
              fetched=1
              break
            fi
            echo "pdfium の取得に失敗（試行 ${attempt}）。待って再試行する"
            sleep $((attempt * 15))
          done
          if [ "$fetched" -ne 1 ]; then
            echo "curl では取得できないため API 経由に切り替える"
            json=$(gh api "repos/bblanchon/pdfium-binaries/releases/tags/chromium%2F7881")
            asset_id=$(printf '%s' "$json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['id'] for a in d['assets'] if a['name']=='pdfium-${asset}.tgz'))")
            test -n "$asset_id"
            gh api "repos/bblanchon/pdfium-binaries/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > pdfium.tgz
          fi
          echo "${sha}  pdfium.tgz" | shasum -a 256 -c -
          tar -xzf pdfium.tgz lib/libpdfium.dylib

      # macOS は生バイナリではなく .app バンドルを配布する。
      # 生バイナリだと Info.plist もアイコンも無く、Finder からアプリとして扱えず、
      # Gatekeeper の扱いも厳しくなる（ローカルの scripts/make-app-bundle.sh と同じ構成）。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="target/${{ matrix.target }}/release/ThundokuShelf.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/thundoku-shelf" "$APP/Contents/MacOS/thundoku-shelf"
          cp crates/app/assets/app-icon/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Thundoku Shelf</string>
            <key>CFBundleDisplayName</key>
            <string>Thundoku Shelf</string>
            <key>CFBundleIdentifier</key>
            <string>com.megablacklabel.thundoku-shelf</string>
            <key>CFBundleExecutable</key>
            <string>thundoku-shelf</string>
            <key>CFBundleIconFile</key>
            <string>icon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.ver.outputs.v }}</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.ver.outputs.v }}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # 実行時ロードする dylib をバンドルへ入れる（アプリは実行ファイルの
          # 隣と ../Frameworks を探す）。署名より前に置くこと — 署名の seal は
          # この時点で中身が確定している必要がある。
          mkdir -p "$APP/Contents/Frameworks"
          cp lib/libpdfium.dylib "$APP/Contents/Frameworks/libpdfium.dylib"
          codesign --force --sign - "$APP/Contents/Frameworks/libpdfium.dylib"
          # .app として ad-hoc 署名し直す。実行ファイル単体の署名（リンカが付ける）だけだと
          # _CodeSignature/CodeResources が無く、codesign --verify が失敗して Gatekeeper が
          # 「壊れているため開けません」と判定しうる。Team ID は無いので ad-hoc（-）で署名する
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # 初回起動は Gatekeeper に止められるので、起動方法を書いた txt も同梱する
          STAGE="target/${{ matrix.target }}/release/dist"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/ThundokuShelf.app"
          cp packaging/macos/はじめにお読みください.txt "$STAGE/"
          # ditto でバンドル構造（権限・リソース）を保ったまま zip 化する
          # --keepParent は付けない = zip 直下に .app と txt が並ぶ
          ditto -c -k "$STAGE" "thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PDFium (Apache-2.0) は実行時ロードなので、exe と同じフォルダに同梱する。
          # pdfium-render の pdfium_7881 バインディングに対応するバージョンを使い、
          # 供給網対策として SHA256 を検証してから展開する。
          # アセットは gh（API 経由）で落とす（CDN 直叩きの一時的な 404 を避ける）。
          $sha = "73cc0de638ac2095e7445bf56a38200a5b7c7ca0e9f4ba144598f2457377ac08"
          gh release download "chromium/7881" --repo bblanchon/pdfium-binaries --pattern "pdfium-win-x64.tgz" --output pdfium.tgz
          $actual = (Get-FileHash pdfium.tgz -Algorithm SHA256).Hash
          if ($actual -ne $sha.ToUpper()) {
            throw "pdfium のチェックサムが一致しません（expected=$sha actual=$actual）"
          }
          tar -xzf pdfium.tgz
          Copy-Item bin/pdfium.dll "target/${{ matrix.target }}/release/pdfium.dll"
          Compress-Archive -Path @(
            "target/${{ matrix.target }}/release/thundoku-shelf.exe",
            "target/${{ matrix.target }}/release/pdfium.dll"
          ) -DestinationPath "thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}
          path: thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
