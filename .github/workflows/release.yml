name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: thundoku-shelf-aarch64-macos.zip
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: thundoku-shelf-x86_64-macos.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: thundoku-shelf-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      # cargo のビルドキャッシュを保存/復元。2 回目以降は依存のフルビルドを省略。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p thundoku-shelf

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: target/${{ matrix.target }}/release
        run: zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact }}" thundoku-shelf

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PDFium (Apache-2.0) は動的ロードなので、exe と同じフォルダに同梱する。
          # pdfium-render の pdfium_7881 バインディングに対応するバージョンを使う。
          curl -fL -o pdfium.zip `
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-win-x64.tgz
          tar -xzf pdfium.zip
          Copy-Item bin/pdfium.dll "target/${{ matrix.target }}/release/pdfium.dll"
          Compress-Archive -Path @("target/${{ matrix.target }}/release/thundoku-shelf.exe", "target/${{ matrix.target }}/release/pdfium.dll") -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
