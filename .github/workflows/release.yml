name: Release

on:
  push:
    tags: ['v*']
  # 手動実行（署名・公証の動作確認用）。タグを切らずに試せる。
  # Release の作成はタグのときだけ行う（release ジョブの if を参照）。
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch だけだと macOS x86_64 と Windows x86_64 でファイル名/アーティファクト名が
          # 衝突する（upload-artifact@v4 は同名で 409 になる）ため os_name も持たせる
          - os: macos-14
            os_name: macos
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-14
            os_name: macos
            target: x86_64-apple-darwin
            arch: x86_64
          - os: windows-latest
            os_name: windows
            target: x86_64-pc-windows-msvc
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 成果物名にバージョンを入れる。タグならタグの番号（v1.2.3 -> 1.2.3）、
      # 手動実行などそれ以外は Cargo.toml の version を使う（"main" のような値が
      # Info.plist や成果物名に入らないようにする）
      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version *= *"\(.*\)".*/\1/p' Cargo.toml | head -1)"
          fi
          test -n "$VERSION"
          echo "v=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      # cargo のビルドキャッシュを保存/復元。2 回目以降は依存のフルビルドを省略。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p thundoku-shelf

      # PDFium (BSD-3-Clause / Apache-2.0) は mupdf (AGPL-3.0) の代替として
      # macOS でも使う。静的リンクはしない — 実行時に dylib をロードする方式なら
      # prebuilt の static ライブラリが macOS で欠いている FPDF_FORMFILL を要求しない。
      # 供給網対策として SHA256 を検証してから展開する。
      - name: Fetch pdfium (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # API 経由のフォールバックで使う。取得は基本 CDN から認証つきで行う。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            aarch64)
              asset=pdfium-mac-arm64
              sha=52e94ca5aa8847934330daf3f8150c190682c5ca93831468794f8b90d4392e40
              ;;
            x86_64)
              asset=pdfium-mac-x64
              sha=6dedf83990e0e3d6b7c93c9e7589c5a126b0ae14b7464d76120cff7a26afb18b
              ;;
            *)
              echo "unknown arch: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac
          # アセット名は `pdfium-mac-arm64.tgz`（`pdfium-` は上の case で付けている）。
          # v0.2.3 でここを二重にして（`pdfium-pdfium-mac-arm64.tgz`）404 を踏んでいた。
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/${asset}.tgz"
          # 混雑時に落ちることがあるので、間を置いて再試行する。
          # それでも駄目なら API 経由（アセット ID）に切り替える。
          fetched=0
          for attempt in 1 2 3; do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o pdfium.tgz "$url"; then
              fetched=1
              break
            fi
            echo "pdfium の取得に失敗（試行 ${attempt}）。待って再試行する"
            sleep $((attempt * 15))
          done
          if [ "$fetched" -ne 1 ]; then
            echo "curl では取得できないため API 経由に切り替える"
            json=$(gh api "repos/bblanchon/pdfium-binaries/releases/tags/chromium%2F7881")
            asset_id=$(printf '%s' "$json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['id'] for a in d['assets'] if a['name']=='${asset}.tgz'))")
            test -n "$asset_id"
            gh api "repos/bblanchon/pdfium-binaries/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > pdfium.tgz
          fi
          echo "${sha}  pdfium.tgz" | shasum -a 256 -c -
          tar -xzf pdfium.tgz lib/libpdfium.dylib

      # Developer ID の証明書を一時キーチェーンに入れる（macOS のみ）。
      # 秘密鍵は GitHub Secrets から環境変数で受け取る（コマンドライン引数に置くと
      # ps から見える）。展開した .p12 はすぐ消し、キーチェーンは最後の Cleanup で必ず消す。
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # 署名用の一時キーチェーン。Cleanup でも同じパスを使う（$RUNNER_TEMP は各ランナーで固有）
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "SIGNING_KEYCHAIN_PW=$KC_PW" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PW" "$KC"
          # 公証の --wait は数十分〜数時間かかることがある。途中でロックされると、
          # 時間のかかった submit の再認証や notarytool log が失敗するので長め（6 時間）にする。
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Developer ID の中間証明書（Apple の G2 Sub-CA）を入れる。.p12 はリーフ 1 件しか
          # 持たないため、ランナーに中間が無いと `find-identity -v` が 0 件になり、codesign は
          # "unable to build chain to self-signed root" / errSecInternalComponent で落ちる。
          # pdfium と同じく、供給網対策として SHA256 を固定して検証してから入れる。
          G2_SHA="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
          echo "${G2_SHA}  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC"
          # 保険として login キーチェーンにも入れておく。identity の探索は `--keychain` で
          # 絞れるが、チェーンの構築（中間証明書の探索）は検索リストのキーチェーンを見るため、
          # 中間が $KC にしか無い環境では `find-identity -v` が 0 件になりうる。
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            -k "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          # 検索リストに $KC を加える（identity ではなくチェーン構築のため）
          security list-keychains -d user -s "$KC" \
            "$HOME/Library/Keychains/login.keychain-db" /Library/Keychains/System.keychain
          # macOS 14 のランナーでは、これが無いと codesign が errSecInternalComponent で落ちる
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          # 以降の署名は毎回 `--keychain "$KC"` を明示する（検索リストを汚さないため）。
          # 有効な identity が 1 件以上見えること = リーフ + 中間 + 秘密鍵が揃っていること。
          IDS="$(security find-identity -v -p codesigning "$KC")"
          printf '%s\n' "$IDS"
          COUNT="$(printf '%s' "$IDS" | sed -n 's/.*\([0-9][0-9]*\) valid identities found.*/\1/p' | head -1)"
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::有効な identity が 0 件（中間証明書か秘密鍵が欠けています）"
            exit 1
          fi

      # macOS は生バイナリではなく .app バンドルを配布する。
      # 生バイナリだと Info.plist もアイコンも無く、Finder からアプリとして扱えず、
      # Gatekeeper の扱いも厳しくなる（ローカルの scripts/make-app-bundle.sh と同じ構成）。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          APP="target/${{ matrix.target }}/release/ThundokuShelf.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/thundoku-shelf" "$APP/Contents/MacOS/thundoku-shelf"
          cp crates/app/assets/app-icon/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Thundoku Shelf</string>
            <key>CFBundleDisplayName</key>
            <string>Thundoku Shelf</string>
            <key>CFBundleIdentifier</key>
            <string>com.megablacklabel.thundoku-shelf</string>
            <key>CFBundleExecutable</key>
            <string>thundoku-shelf</string>
            <key>CFBundleIconFile</key>
            <string>icon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.ver.outputs.v }}</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.ver.outputs.v }}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # 実行時ロードする dylib をバンドルへ入れる（アプリは実行ファイルの
          # 隣と ../Frameworks を探す）。署名より前に置くこと — 署名の seal は
          # この時点で中身が確定している必要がある。
          mkdir -p "$APP/Contents/Frameworks"
          cp lib/libpdfium.dylib "$APP/Contents/Frameworks/libpdfium.dylib"
          # ── 署名 ──
          # Developer ID で署名する。ad-hoc だと Gatekeeper が「壊れているため開けません」側の
          # 判定になり、公証も受けられない。順序は dylib → .app（.app の seal はこの時点の
          # 中身で確定する）。`--options runtime`（Hardened Runtime）は公証の要件で、これを
          # 付けると library validation が有効になり、同梱 dylib が別 Team の署名だと
          # ロード時に弾かれる（PDFium は実行時ロードなので特に効く）ので、同じ鍵で署名する。
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          echo "署名 ID: $IDENTITY"
          codesign --force --options runtime --timestamp \
            --keychain "$KC" --sign "$IDENTITY" "$APP/Contents/Frameworks/libpdfium.dylib"
          codesign --force --options runtime --timestamp \
            --keychain "$KC" --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # ── 公証 ──
          # 署名から公証までの間にロックされる可能性に備えて解錠し直す（-lut は 6 時間）
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PW" "$KC"
          # zip には直接 staple できない（Apple のドキュメント）。notarytool に出すのは
          # 提出用の zip で、staple は .app に当て、配布用の zip は staple 後に作り直す。
          # パスワードはキーチェーンのプロファイルに入れて、以降のコマンドラインに残さない。
          xcrun notarytool store-credentials "thundoku-notary" \
            --keychain "$KC" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          set +e
          NOTARY_OUT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --keychain-profile "thundoku-notary" --keychain "$KC" --wait 2>&1)"
          NOTARY_STATUS=$?
          set -e
          printf '%s\n' "$NOTARY_OUT"
          # 成功しても警告が入っていることがあるのでログは常に出す（Apple の推奨）
          NOTARY_ID="$(printf '%s' "$NOTARY_OUT" | sed -n 's/^ *id: *//p' | head -1)"
          if [ -n "$NOTARY_ID" ]; then
            xcrun notarytool log "$NOTARY_ID" \
              --keychain-profile "thundoku-notary" --keychain "$KC" \
              || echo "::warning::notarytool log の取得に失敗しました（キーチェーンのロックなど）"
          fi
          if [ "$NOTARY_STATUS" -ne 0 ]; then
            echo "::error::公証が通りませんでした。上のログを確認してください"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vv -t exec "$APP"
          # 公証済みなので初回起動の Gatekeeper 解除は不要。それでも環境によっては
          # 止まることがあるため、起動方法を書いた txt は同梱しておく。
          STAGE="target/${{ matrix.target }}/release/dist"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/ThundokuShelf.app"
          cp packaging/macos/はじめにお読みください.txt "$STAGE/"
          # ditto でバンドル構造（権限・リソース）を保ったまま zip 化する
          # --keepParent は付けない = zip 直下に .app と txt が並ぶ
          ditto -c -k "$STAGE" "thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PDFium (Apache-2.0) は実行時ロードなので、exe と同じフォルダに同梱する。
          # pdfium-render の pdfium_7881 バインディングに対応するバージョンを使い、
          # 供給網対策として SHA256 を検証してから展開する。
          # アセットは gh（API 経由）で落とす（CDN 直叩きの一時的な 404 を避ける）。
          $sha = "73cc0de638ac2095e7445bf56a38200a5b7c7ca0e9f4ba144598f2457377ac08"
          gh release download "chromium/7881" --repo bblanchon/pdfium-binaries --pattern "pdfium-win-x64.tgz" --output pdfium.tgz
          $actual = (Get-FileHash pdfium.tgz -Algorithm SHA256).Hash
          if ($actual -ne $sha.ToUpper()) {
            throw "pdfium のチェックサムが一致しません（expected=$sha actual=$actual）"
          }
          tar -xzf pdfium.tgz
          Copy-Item bin/pdfium.dll "target/${{ matrix.target }}/release/pdfium.dll"
          Compress-Archive -Path @(
            "target/${{ matrix.target }}/release/thundoku-shelf.exe",
            "target/${{ matrix.target }}/release/pdfium.dll"
          ) -DestinationPath "thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}
          path: thundoku-shelf-${{ steps.ver.outputs.v }}-${{ matrix.arch }}-${{ matrix.os_name }}.zip
          if-no-files-found: error

      # 一時キーチェーンと展開済み .p12 を必ず消す（失敗時も実行する）
      - name: Cleanup signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/cert.p12 "$RUNNER_TEMP"/notarize.zip || true

  release:
    needs: build
    runs-on: ubuntu-latest
    # 手動実行（workflow_dispatch）やブランチ ref では Release を作らない
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
