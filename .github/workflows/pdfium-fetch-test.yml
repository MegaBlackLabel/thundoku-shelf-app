name: pdfium fetch test (temporary)

# 使い捨ての検証用ワークフロー。
# v0.2.3 の Release で macOS ランナーからの pdfium 取得だけが失敗したため、
# 「未認証 curl / 認証つき curl / API 経由」のどれが通るかを mac ランナー上で確かめる。
# 確認できたら削除する。

on:
  workflow_dispatch:

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            asset: pdfium-mac-arm64
            sha: 52e94ca5aa8847934330daf3f8150c190682c5ca93831468794f8b90d4392e40
          - arch: x86_64
            asset: pdfium-mac-x64
            sha: 6dedf83990e0e3d6b7c93c9e7589c5a126b0ae14b7464d76120cff7a26afb18b
    runs-on: macos-14
    steps:
      - name: Show gh version
        run: gh --version

      - name: 未認証 curl（1 回目の失敗の再現確認）
        continue-on-error: true
        run: |
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/${{ matrix.asset }}.tgz"
          code=$(curl -sSL -o /dev/null -w "%{http_code}" "$url" || true)
          echo "unauthenticated http=$code"

      - name: 認証つき curl
        run: |
          set -euo pipefail
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/${{ matrix.asset }}.tgz"
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -o pdfium.tgz "$url"
          echo "${{ matrix.sha }}  pdfium.tgz" | shasum -a 256 -c -

      - name: API 経由（アセット ID を python3 で引く）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(gh api "repos/bblanchon/pdfium-binaries/releases/tags/chromium%2F7881")
          id=$(printf '%s' "$json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['id'] for a in d['assets'] if a['name']=='${{ matrix.asset }}.tgz'))")
          echo "asset id=$id"
          gh api "repos/bblanchon/pdfium-binaries/releases/assets/$id" -H "Accept: application/octet-stream" > api.tgz
          echo "${{ matrix.sha }}  api.tgz" | shasum -a 256 -c -

      - name: gh release download（既存のやり方の再確認）
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh release download "chromium/7881" --repo bblanchon/pdfium-binaries \
            --pattern "${{ matrix.asset }}.tgz" --output gh.tgz && echo "gh release download OK" || echo "gh release download FAILED"
