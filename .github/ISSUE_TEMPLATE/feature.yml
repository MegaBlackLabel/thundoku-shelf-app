name: 機能要望
description: 新しい機能や改善の提案はこちら
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。まず [既存の Issue を検索](https://github.com/MegaBlackLabel/thundoku-shelf-app/issues?q=is%3Aissue) して、同じ提案が無いか確認してください。

        アプリの「レポート」画面から送ると、この下書きが入力済みの状態で開きます。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どんな機能がほしいですか？
      placeholder: 本棚のリスト表示でも表紙の大きさを切り替えたい
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: いま何に困っていますか？（機能そのものより、困りごとの方が解決策を選びやすいです）
      placeholder: 表紙が小さいと、見分けがつかない本がある
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案（任意）
      description: 他に考えた方法や、既に試した回避策があれば。
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 補足（スクリーンショットなど）
      description: 画像はここにドラッグ&ドロップできます。
    validations:
      required: false
